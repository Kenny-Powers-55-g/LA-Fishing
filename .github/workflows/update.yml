name: Update fishing data

on:
  schedule:
    # Hourly is enough for water and weather, but GitHub often starts scheduled runs 30-60 minutes late.
    # The :45 slot is a backup: the "fresh" job below skips the update when the live data is under
    # 25 minutes old, so it only does the work when the :15 run was late or failed.
    - cron: "15 * * * *"
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write      # only to keep the schedules switched on (see the last step)

# Do not use the shared "pages" group — it collides with other Pages deploys and
# cancels runs with "higher priority waiting request for pages exists".
concurrency:
  group: la-fishing-update
  # Wait for a running update to finish instead of cancelling it (a cancelled run can be
  # stopped half-way through publishing the site). The next run then starts right after.
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - name: Is the live data recent enough to skip this run?
        id: age
        run: |
          # Runs started by hand, or at :15, always update. The :45 backup only updates stale data.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo/latest.json"
          gen=$(curl -sfL "$url?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])" 2>/dev/null || true)
          age=$(python3 -c "import sys; from datetime import datetime, timezone as tz; print(int((datetime.now(tz.utc)-datetime.fromisoformat(sys.argv[1])).total_seconds()//60))" "$gen" 2>/dev/null || echo 999)
          echo "Live data is $age minutes old"
          if [ "$age" -lt 25 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  build-and-deploy:
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved station lookups
        id: stations
        uses: actions/cache/restore@v4
        with:
          path: stations_cache.json
          # v2: started fresh after lookups that had failed were being kept forever
          key: stations-v2-${{ github.run_id }}
          restore-keys: stations-v2-

      - name: Test the code before using it
        run: |
          python -m unittest discover -s tests -v
          node tests/check_page.js
          node tests/check_site.js
          node tests/check_community.js
          node tests/check_scoring.js
          node tests/check_pages.js

      - name: Get history and the weekly map layers from the live site
        # Retries each file. "Not there yet" (404) is fine, but if history, trends or alert state can't
        # be fetched for any other reason the run stops here and the live site keeps its good copies,
        # instead of publishing fresh empty ones over them.
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          site="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo"
          lost=""
          for f in history.json forecast.json scores-daily.json rigs.json reefs.json launches.json alerts_state.json tropical.json deadzone.json community.json; do
            code=$(curl -sL --retry 4 --retry-all-errors --retry-delay 5 --max-time 60 -w "%{http_code}" "$site/$f?t=$(date +%s)" -o "$f.dl" || echo 000)
            if [ "$code" = "200" ] && [ -s "$f.dl" ]; then mv "$f.dl" "$f"; echo "$f: $(wc -c < "$f") bytes"
            else rm -f "$f.dl"; echo "$f: not fetched (HTTP $code)"
              case "$f" in history.json|scores-daily.json|alerts_state.json) [ "$code" = "404" ] || lost="$lost $f";; esac
            fi
          done
          [ -f history.json ] && cp history.json history.json.prev
          if [ -n "$lost" ]; then echo "::error::Couldn't fetch$lost from the live site; stopping so the live copies aren't replaced"; exit 1; fi

      - name: Pull the latest readings
        run: python ingest.py once
        timeout-minutes: 35
        env:
          # Free key from https://api.waterdata.usgs.gov/signup, saved as a repository
          # secret named USGS_API_KEY. Without it, USGS may rate-limit the hourly run.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          INGEST_WORKERS: "4"

      - name: Save the station lookups
        # Saved even when a later step fails, so a slow first run's lookups aren't thrown away
        # and the next run doesn't have to start from nothing again.
        if: always() && hashFiles('stations_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: stations_cache.json
          key: stations-v2-${{ github.run_id }}

      - name: Check the new data before publishing it
        # If this fails, nothing is deployed and the site keeps the last good data.
        run: python ingest.py validate

      - name: Update community tuning from anonymous catch reports
        id: community
        # Reads totals (never single reports) from Supabase with the public key in config.js and
        # writes community.json. If Supabase can't be reached, the previous file is kept.
        continue-on-error: true
        run: node scripts/community.js

      - name: Save today's scores for trends
        id: snapshot
        continue-on-error: true
        env:
          TZ: America/Chicago        # times on the home page card ("Sat 3 PM–6 PM") are Louisiana time
        run: node scripts/snapshot.js

      - name: Write the search pages (one per spot and fish) and the sitemap
        id: pages
        continue-on-error: true
        env:
          TZ: America/Chicago
        run: node scripts/pages.js

      - name: Send phone alerts
        id: alerts
        # Rules live in alerts.json. Needs the NTFY_TOPIC repository secret; without it this
        # prints what it would have sent. Never blocks the deploy.
        continue-on-error: true
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          SITE_URL="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo" node scripts/alerts.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Collect the site files
        run: |
          mkdir site
          cp index.html map.html about.html contact.html terms.html privacy.html site.css site.js board.js track.js forward.js hero.jpg hero-800.webp hero-1200.webp hero-1600.webp sitemap.xml robots.txt og-image.png config.js latest.json forecast.json manifest.webmanifest sw.js site/
          for f in icon-192.png icon-512.png favicon.svg apple-touch-icon.png status.json history.json scores-daily.json board.json ocean.json rigs.json reefs.json launches.json tropical.json deadzone.json alerts_state.json community.json; do
            [ -f "$f" ] && cp "$f" site/ || true
          done
          for d in spots fish; do [ -d "$d" ] && cp -r "$d" site/ || true; done
          # Fail clearly if core data is missing
          test -f site/latest.json
          test -f site/index.html
          test -f site/map.html
          # Refresh the security policy's inline-script fingerprints for the published page
          node scripts/csp.js site/map.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub Pages sometimes can't find the upload it was just given ("Fetching artifact metadata
        # failed"). That's on GitHub's side, so wait a minute and try once more before giving up.
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Tell the uptime monitor the site updated
        # Optional: set the HEALTHCHECK_URL repository secret to a healthchecks.io ping URL and it emails you
        # when updates stop (README, "Keeping it running"). Without the secret this does nothing.
        if: steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success'
        continue-on-error: true
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -n "$HEALTHCHECK_URL" ] || { echo "No HEALTHCHECK_URL secret; skipping"; exit 0; }
          curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null && echo "pinged"

      - name: Mark the run failed if a side step failed
        # Those steps don't stop the deploy (the scores still publish), but a red run gets GitHub's email,
        # so a broken search-page or snapshot script doesn't go unnoticed.
        if: always()
        run: |
          bad=""
          [ "${{ steps.community.outcome }}" = "failure" ] && bad="$bad community"
          [ "${{ steps.snapshot.outcome }}" = "failure" ] && bad="$bad snapshot"
          [ "${{ steps.pages.outcome }}" = "failure" ] && bad="$bad search-pages"
          [ "${{ steps.alerts.outcome }}" = "failure" ] && bad="$bad alerts"
          if [ -n "$bad" ]; then echo "::error::These steps failed (the site still updated):$bad"; exit 1; fi

      - name: Keep the schedules switched on
        # GitHub switches off scheduled workflows in a public repository after 60 days without a commit,
        # and deploying doesn't count. Re-enabling them once a day resets that clock. Never blocks a run.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "12" ] || exit 0
          for wf in update.yml health.yml; do gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "$wf: enabled"; done
