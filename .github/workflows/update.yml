name: Update fishing data

on:
  schedule:
    # Hourly is enough for water and weather, but GitHub often starts scheduled runs 30-60 minutes late.
    # The :45 slot is a backup: the "fresh" job below skips the update when the live data is under
    # 40 minutes old, so it only does the work when the :15 run was late or failed.
    - cron: "15 * * * *"
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not use the shared "pages" group — it collides with other Pages deploys and
# cancels runs with "higher priority waiting request for pages exists".
concurrency:
  group: la-fishing-update
  # Wait for a running update to finish instead of cancelling it (a cancelled run can be
  # stopped half-way through publishing the site). The next run then starts right after.
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - name: Is the live data recent enough to skip this run?
        id: age
        run: |
          # Runs started by hand, or at :15, always update. The :45 backup only updates stale data.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo/latest.json"
          gen=$(curl -sfL "$url?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'])" 2>/dev/null || true)
          age=$(python3 -c "import sys; from datetime import datetime, timezone as tz; print(int((datetime.now(tz.utc)-datetime.fromisoformat(sys.argv[1])).total_seconds()//60))" "$gen" 2>/dev/null || echo 999)
          echo "Live data is $age minutes old"
          if [ "$age" -lt 40 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  build-and-deploy:
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved station lookups
        uses: actions/cache@v4
        with:
          path: stations_cache.json
          key: stations-${{ github.run_id }}
          restore-keys: stations-

      - name: Test the code before using it
        run: |
          python -m unittest discover -s tests -v
          node tests/check_page.js
          node tests/check_site.js
          node tests/check_community.js
          node tests/check_scoring.js

      - name: Get history and the weekly map layers from the live site
        continue-on-error: true
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          site="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo"
          for f in history.json scores-daily.json rigs.json reefs.json alerts_state.json tropical.json deadzone.json community.json; do
            curl -sfL "$site/$f" -o "$f" && echo "$f: $(wc -c < "$f") bytes" || echo "no $f yet; it will be built"
          done

      - name: Pull the latest readings
        run: python ingest.py once
        timeout-minutes: 35
        env:
          # Free key from https://api.waterdata.usgs.gov/signup, saved as a repository
          # secret named USGS_API_KEY. Without it, USGS may rate-limit the hourly run.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          INGEST_WORKERS: "4"

      - name: Check the new data before publishing it
        # If this fails, nothing is deployed and the site keeps the last good data.
        run: python ingest.py validate

      - name: Update community tuning from anonymous catch reports
        # Reads totals (never single reports) from Supabase with the public key in config.js and
        # writes community.json. If Supabase can't be reached, the previous file is kept.
        continue-on-error: true
        run: node scripts/community.js

      - name: Save today's scores for trends
        continue-on-error: true
        run: node scripts/snapshot.js

      - name: Send phone alerts
        # Rules live in alerts.json. Needs the NTFY_TOPIC repository secret; without it this
        # prints what it would have sent. Never blocks the deploy.
        continue-on-error: true
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          SITE_URL="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo" node scripts/alerts.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Collect the site files
        run: |
          mkdir site
          cp index.html map.html about.html contact.html terms.html privacy.html site.css site.js board.js forward.js hero.jpg hero-800.webp hero-1200.webp hero-1600.webp sitemap.xml robots.txt og-image.png hero.jpg config.js latest.json forecast.json manifest.webmanifest sw.js site/
          for f in icon-192.png icon-512.png favicon.svg apple-touch-icon.png status.json history.json scores-daily.json board.json ocean.json rigs.json reefs.json tropical.json deadzone.json alerts_state.json community.json; do
            [ -f "$f" ] && cp "$f" site/ || true
          done
          # Fail clearly if core data is missing
          test -f site/latest.json
          test -f site/index.html
          test -f site/map.html
          # Refresh the security policy's inline-script fingerprints for the published page
          node scripts/csp.js site/map.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub Pages sometimes can't find the upload it was just given ("Fetching artifact metadata
        # failed"). That's on GitHub's side, so wait a minute and try once more before giving up.
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
