name: Update fishing data

on:
  schedule:
    # Hourly is enough for water/weather; avoids overlapping 30‑min runs when ingest is slow
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not use the shared "pages" group — it collides with other Pages deploys and
# cancels runs with "higher priority waiting request for pages exists".
concurrency:
  group: la-fishing-update
  # Wait for a running update to finish instead of cancelling it (a cancelled run can be
  # stopped half-way through publishing the site). The next run then starts right after.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved station lookups
        uses: actions/cache@v4
        with:
          path: stations_cache.json
          key: stations-${{ github.run_id }}
          restore-keys: stations-

      - name: Test the code before using it
        run: |
          python -m unittest discover -s tests -v
          node tests/check_page.js
          node tests/check_site.js

      - name: Get history and the weekly map layers from the live site
        continue-on-error: true
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          site="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo"
          for f in history.json scores-daily.json rigs.json reefs.json alerts_state.json tropical.json deadzone.json; do
            curl -sfL "$site/$f" -o "$f" && echo "$f: $(wc -c < "$f") bytes" || echo "no $f yet; it will be built"
          done

      - name: Pull the latest readings
        run: python ingest.py once
        timeout-minutes: 35
        env:
          # Free key from https://api.waterdata.usgs.gov/signup, saved as a repository
          # secret named USGS_API_KEY. Without it, USGS may rate-limit the hourly run.
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          INGEST_WORKERS: "4"

      - name: Check the new data before publishing it
        # If this fails, nothing is deployed and the site keeps the last good data.
        run: python ingest.py validate

      - name: Save today's scores for trends
        continue-on-error: true
        run: node scripts/snapshot.js

      - name: Send phone alerts
        # Rules live in alerts.json. Needs the NTFY_TOPIC repository secret; without it this
        # prints what it would have sent. Never blocks the deploy.
        continue-on-error: true
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          SITE_URL="https://$(echo "$owner" | tr 'A-Z' 'a-z').github.io/$repo" node scripts/alerts.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Collect the site files
        run: |
          mkdir site
          cp index.html map.html about.html contact.html terms.html privacy.html site.css site.js board.js forward.js sitemap.xml robots.txt og-image.png logo-on-dark.png topo-header.svg topo-band.svg topo-hero.svg config.js latest.json forecast.json manifest.webmanifest sw.js site/
          for f in icon-192.png icon-512.png favicon.svg apple-touch-icon.png status.json history.json scores-daily.json board.json ocean.json rigs.json reefs.json tropical.json deadzone.json alerts_state.json; do
            [ -f "$f" ] && cp "$f" site/ || true
          done
          # Fail clearly if core data is missing
          test -f site/latest.json
          test -f site/index.html
          test -f site/map.html
          # Refresh the security policy's inline-script fingerprints for the published page
          node scripts/csp.js site/map.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
