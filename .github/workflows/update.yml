name: Update fishing data

on:
  schedule:
    - cron: "*/30 * * * *"   # about every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the latest readings
        run: python ingest.py once

      - name: Collect the site files
        run: |
          mkdir site
          cp index.html latest.json forecast.json manifest.webmanifest sw.js icon-192.png icon-512.png site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
